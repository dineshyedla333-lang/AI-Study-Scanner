<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="stylesheet" href="katex.min.css">
<style>
  html, body { margin: 0; padding: 0; background: transparent; }
  body {
    font-family: sans-serif;
    font-size: 15px;
    line-height: 1.5;
    color: var(--text, #1c1b1f);
    overflow-wrap: break-word;
    -webkit-text-size-adjust: 100%;
  }
  p { margin: 0.35em 0; }
  h1, h2, h3, h4 { font-size: 1.05em; margin: 0.6em 0 0.2em; }
  ul, ol { margin: 0.3em 0; padding-left: 1.4em; }
  li { margin: 0.15em 0; }
  hr { border: 0; border-top: 1px solid var(--border, rgba(0,0,0,0.2)); margin: 0.6em 0; }
  code { font-family: monospace; font-size: 0.92em; }
  pre { white-space: pre-wrap; margin: 0.4em 0; }
  table { border-collapse: collapse; margin: 0.5em 0; display: block; max-width: 100%; overflow-x: auto; }
  th, td { border: 1px solid var(--border, rgba(0,0,0,0.2)); padding: 3px 8px; text-align: left; }
  .katex { font-size: 1.08em; }
  .katex-display { margin: 0.5em 0; overflow-x: auto; overflow-y: hidden; padding: 2px 0; }
</style>
</head>
<body>
<div id="content"></div>
<script src="marked.min.js"></script>
<script src="katex.min.js"></script>
<script src="auto-render.min.js"></script>
<script>
  // Markdown (marked) plus LaTeX (KaTeX). Math is lifted out before the
  // markdown pass because marked would otherwise eat the backslashes in
  // \( \) and turn `t_{1}` underscores into emphasis; it is put back as
  // escaped text and rendered by KaTeX's auto-render afterwards.
  var MATH_RE = /\\\[[\s\S]*?\\\]|\\\([\s\S]*?\\\)|\$\$[\s\S]*?\$\$/g;
  var PLACEHOLDER_RE = /(\d+)/g;

  function escapeHtml(s) {
    return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
  }

  function render(markdown) {
    var chunks = [];
    var safe = markdown.replace(MATH_RE, function (m) {
      chunks.push(m);
      return "" + (chunks.length - 1) + "";
    });
    var html = marked.parse(safe, { breaks: true, gfm: true });
    html = html.replace(PLACEHOLDER_RE, function (_, i) { return escapeHtml(chunks[+i]); });
    var root = document.getElementById("content");
    root.innerHTML = html;
    renderMathInElement(root, {
      delimiters: [
        { left: "$$", right: "$$", display: true },
        { left: "\\[", right: "\\]", display: true },
        { left: "\\(", right: "\\)", display: false },
        { left: "$", right: "$", display: false }
      ],
      throwOnError: false,
      strict: false
    });
    reportHeight();
    // KaTeX fonts load lazily from assets; the layout shifts once they are in.
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(reportHeight);
    }
    setTimeout(reportHeight, 300);
  }

  function reportHeight() {
    if (window.MathBridge) {
      MathBridge.onHeight(document.documentElement.scrollHeight);
    }
  }

  function setTextColor(css) {
    document.documentElement.style.setProperty("--text", css);
    document.documentElement.style.setProperty("--border", css.replace(/\)$/, ",0.25)").replace("rgb(", "rgba("));
  }
</script>
</body>
</html>
