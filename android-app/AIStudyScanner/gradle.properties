# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX
android.useAndroidX=true
android.enableJetifier=true

# Kotlin/Compose
kotlin.code.style=official
android.nonTransitiveRClass=true

# Release config defaults for local development. Override in CI or untracked local files.
API_BASE_URL=https://ai-study-scanner.onrender.com
# Keep in step with the last upload to Play; Play rejects a reused version code.
# 14 = v1.2.5, published to Production 2026-08-01. Next build must use 15+.
# 15 = v1.3.0, adds the Pro subscription — a feature release, hence the minor bump.
RELEASE_VERSION_CODE=15
RELEASE_VERSION_NAME=1.3.0

RELEASE_STORE_FILE=../release.keystore
RELEASE_KEY_ALIAS=ai-study-scanner
# RELEASE_STORE_PASSWORD= (set in local gradle.properties or CI secrets — never commit)
# RELEASE_KEY_PASSWORD= (set in local gradle.properties or CI secrets — never commit)
# SENTRY_DSN=https://examplePublicKey@o0.ingest.sentry.io/0
