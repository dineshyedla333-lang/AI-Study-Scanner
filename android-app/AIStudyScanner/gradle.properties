# Project-wide Gradle settings.
org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8

# AndroidX
android.useAndroidX=true
android.enableJetifier=true

# Kotlin/Compose
kotlin.code.style=official
android.nonTransitiveRClass=true

# Release config defaults for local development. Override in CI or untracked local files.
API_BASE_URL=http://10.0.2.2:8000
RELEASE_VERSION_CODE=1
RELEASE_VERSION_NAME=1.0.0

# Release signing should be supplied locally or in CI, for example:
# RELEASE_STORE_FILE=keystore/release.keystore
# RELEASE_STORE_PASSWORD=change-me
# RELEASE_KEY_ALIAS=release
# RELEASE_KEY_PASSWORD=change-me
# SENTRY_DSN=https://examplePublicKey@o0.ingest.sentry.io/0
