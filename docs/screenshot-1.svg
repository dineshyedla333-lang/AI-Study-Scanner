<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1a1a2e"/>
      <stop offset="100%" style="stop-color:#16213e"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="1080" height="1920" fill="url(#bg)"/>

  <!-- Top label -->
  <rect x="340" y="120" width="400" height="60" rx="30" fill="#FFD700"/>
  <rect x="390" y="140" width="24" height="20" fill="#1a1a2e"/>
  <polygon points="390,140 402,140 414,160 402,160" fill="#1a1a2e"/>
  <rect x="422" y="140" width="8" height="20" fill="#1a1a2e"/>
  <rect x="438" y="140" width="60" height="5" rx="2" fill="#1a1a2e"/>
  <rect x="438" y="152" width="45" height="5" rx="2" fill="#1a1a2e"/>
  <rect x="438" y="164" width="52" height="5" rx="2" fill="#1a1a2e"/>
  <rect x="510" y="140" width="50" height="5" rx="2" fill="#1a1a2e"/>
  <rect x="510" y="152" width="38" height="5" rx="2" fill="#1a1a2e"/>
  <rect x="510" y="164" width="44" height="5" rx="2" fill="#1a1a2e"/>
  <rect x="572" y="140" width="120" height="5" rx="2" fill="#1a1a2e"/>
  <rect x="572" y="152" width="90" height="5" rx="2" fill="#1a1a2e"/>

  <!-- Headline text blocks (simulated white text) -->
  <rect x="80" y="240" width="920" height="80" rx="8" fill="white" opacity="0.95"/>
  <rect x="80" y="340" width="700" height="80" rx="8" fill="white" opacity="0.95"/>

  <!-- Subtext -->
  <rect x="80" y="460" width="800" height="30" rx="6" fill="white" opacity="0.5"/>
  <rect x="80" y="504" width="640" height="30" rx="6" fill="white" opacity="0.5"/>

  <!-- Phone mockup frame -->
  <rect x="190" y="600" width="700" height="1100" rx="60" fill="#0f0f1a" stroke="#e8e8ff" stroke-width="8"/>
  <rect x="210" y="620" width="660" height="1060" rx="48" fill="#1a1a2e"/>

  <!-- Camera notch -->
  <rect x="440" y="628" width="200" height="30" rx="15" fill="#0f0f1a"/>
  <circle cx="540" cy="643" r="8" fill="#333"/>

  <!-- App screen content inside phone -->
  <!-- Top bar -->
  <rect x="210" y="660" width="660" height="60" rx="0" fill="#16213e"/>
  <rect x="230" y="678" width="200" height="20" rx="4" fill="white" opacity="0.9"/>

  <!-- Scanner viewfinder -->
  <rect x="250" y="740" width="580" height="400" rx="12" fill="#0a0a1a"/>
  <!-- Corner brackets -->
  <rect x="270" y="760" width="50" height="8" fill="#FFD700"/>
  <rect x="270" y="760" width="8" height="50" fill="#FFD700"/>
  <rect x="760" y="760" width="50" height="8" fill="#FFD700"/>
  <rect x="802" y="760" width="8" height="50" fill="#FFD700"/>
  <rect x="270" y="1112" width="50" height="8" fill="#FFD700"/>
  <rect x="270" y="1072" width="8" height="50" fill="#FFD700"/>
  <rect x="760" y="1112" width="50" height="8" fill="#FFD700"/>
  <rect x="802" y="1072" width="8" height="50" fill="#FFD700"/>
  <!-- Document lines -->
  <rect x="330" y="840" width="420" height="12" rx="4" fill="white" opacity="0.3"/>
  <rect x="330" y="870" width="380" height="12" rx="4" fill="white" opacity="0.3"/>
  <rect x="330" y="900" width="400" height="12" rx="4" fill="white" opacity="0.3"/>
  <rect x="330" y="930" width="350" height="12" rx="4" fill="white" opacity="0.3"/>

  <!-- Capture button -->
  <circle cx="540" cy="1230" r="50" fill="none" stroke="#FFD700" stroke-width="6"/>
  <circle cx="540" cy="1230" r="36" fill="#FFD700"/>

  <!-- Bottom text on screen -->
  <rect x="280" y="1310" width="200" height="24" rx="6" fill="white" opacity="0.4"/>
  <rect x="600" y="1310" width="180" height="24" rx="6" fill="#FFD700" opacity="0.8"/>

  <!-- Main title below phone -->
  <!-- "Scan Any Study Question" simulated as large text block -->
  <rect x="80" y="1740" width="920" height="50" rx="8" fill="white" opacity="0.9"/>
  <rect x="80" y="1806" width="700" height="36" rx="6" fill="white" opacity="0.5"/>

  <!-- Gold star accent -->
  <circle cx="540" cy="1880" r="10" fill="#FFD700"/>
  <circle cx="510" cy="1880" r="6" fill="#FFD700" opacity="0.6"/>
  <circle cx="570" cy="1880" r="6" fill="#FFD700" opacity="0.6"/>
</svg>
